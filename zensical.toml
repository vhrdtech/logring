# The logring book: the pages in docs/, built with Zensical (`just book`, `just book-serve`, `just book-check`).
# It stands on its own: the WireWeaver and ww_tape books are separate sites, linked by their URLs.
[project]
site_url = "https://lr.vhrd.tech/"
site_name = "logring"
site_description = "A power-cut-safe log store for embedded devices"
site_author = "Roman Isaikin"

copyright = "Copyright &copy; 2026 vhrdtech"

repo_url = "https://github.com/vhrdtech/logring"
repo_name = "vhrdtech/logring"
edit_uri = "edit/main/docs/"

nav = [
    { "Introduction" = [
            "index.md",
            "related_books.md"
        ]
    },
    { "Choosing a store" = [
            "tapes_and_logring.md"
        ]
    },
    { "Reference" = [
            "format.md",
            { "Features and roadmap" = "https://github.com/vhrdtech/logring/blob/main/FEATURES.md" },
            { "Changelog" = "https://github.com/vhrdtech/logring/blob/main/CHANGELOG.md" }
        ]
    }
]

# figures.css: the classes of the SVG figures the pages inline from docs/figures, light and dark
extra_css = ["stylesheets/vhrd.css", "stylesheets/figures.css"]

[project.theme]
language = "en"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.theme.font]
text = "IBM Plex Sans"
code = "IBM Plex Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"
primary = "custom"
accent = "custom"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"
primary = "custom"
accent = "custom"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/vhrdtech/logring"
name = "logring on GitHub"

[[project.extra.social]]
icon = "fontawesome/solid/globe"
link = "https://vhrd.tech"
name = "vhrd.tech website"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc = {
  permalink = true
}
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.highlight = {
  anchor_linenums = true,
  line_spans = "__span",
  pygments_lang_class = true,
}
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# Inlines the SVG figures (`--8<-- "docs/figures/logring.svg"`), paths from the repository root
pymdownx.snippets = {
  base_path = ["."],
  check_paths = true
}
pymdownx.superfences = {}
pymdownx.tabbed = {
  alternate_style = true,
  combine_header_slug = true
}
pymdownx.tasklist = {
  custom_checkbox = true
}
pymdownx.tilde = {}
