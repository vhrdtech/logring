[workspace]
resolver = "3"
exclude = ["fuzz"]
members = [
    "crates/ww_logring",
    "crates/ww_logring_cli",
    "crates/ww_logring_export",
    "crates/ww_logring_py",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Roman Isaikin <roman@vhrd.tech>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/vhrdtech/logring"
rust-version = "1.88"

[workspace.dependencies]
ww_logring = { path = "crates/ww_logring", version = "0.1.0", default-features = false }

anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }
crc = "3.4"
indicatif = "0.18"
pyo3 = { version = "0.29", features = ["abi3-py39"] }
serde_json = "1"
thiserror = { version = "2", default-features = false }

# wire_weaver 0.5 is unreleased: git with a pinned rev, bumped on purpose in its own commit (AGENTS.md "Dependencies")
wire_weaver = { git = "https://github.com/vhrdtech/wire_weaver", rev = "fcd8984d793704f903984e829b7b33263d223918", default-features = false }
ww_si = { git = "https://github.com/vhrdtech/wire_weaver", rev = "fcd8984d793704f903984e829b7b33263d223918", default-features = false, features = ["time", "u32", "u64"] }
ww_stream = { git = "https://github.com/vhrdtech/wire_weaver", rev = "fcd8984d793704f903984e829b7b33263d223918", default-features = false, features = ["log-store"] }
