[package]
name = "logring_fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
logring = { path = "../crates/logring", features = ["std"] }
ww_stream = { path = "../../wire_weaver/ww_stream", default-features = false, features = ["log-store", "std"] }

[[bin]]
name = "mount"
path = "fuzz_targets/mount.rs"
test = false
doc = false
bench = false
