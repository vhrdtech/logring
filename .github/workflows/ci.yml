name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: logring
    steps:
      - uses: actions/checkout@v4
        with:
          path: logring
      - uses: actions/checkout@v4
        with:
          repository: vhrdtech/wire_weaver
          path: wire_weaver
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: logring
    steps:
      - uses: actions/checkout@v4
        with:
          path: logring
      - uses: actions/checkout@v4
        with:
          repository: vhrdtech/wire_weaver
          path: wire_weaver
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: thumbv8m.main-none-eabihf
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo check -p logring --no-default-features --target thumbv8m.main-none-eabihf
      - run: cargo clippy -p logring --all-targets --no-default-features --features std,card-check,crc-table -- -D warnings

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: logring
    steps:
      - uses: actions/checkout@v4
        with:
          path: logring
      - uses: actions/checkout@v4
        with:
          repository: vhrdtech/wire_weaver
          path: wire_weaver
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      # the small build (no tail-positions): its mount, power-cut and cross-build tests
      - run: cargo test -p logring --no-default-features --features std

  test-py:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: logring
    steps:
      - uses: actions/checkout@v4
        with:
          path: logring
      - uses: actions/checkout@v4
        with:
          repository: vhrdtech/wire_weaver
          path: wire_weaver
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
      - working-directory: logring/crates/logring_wheel
        run: uv run --group dev pytest -q

  cargo-sort:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: logring
    steps:
      - uses: actions/checkout@v4
        with:
          path: logring
      - uses: actions/checkout@v4
        with:
          repository: vhrdtech/wire_weaver
          path: wire_weaver
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-sort
      - run: cargo sort --workspace --grouped --check

  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@v1

  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # spl, spirit_level's CLI, at the commit the prose lints were set up with (0.5.4)
      - run: cargo install --locked --git https://github.com/romixlab/spirit_level --rev a7fe9c6f8bd13f299c3091583846299fb00942b6 spirit_level_cli
      - run: just book-check
