name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: logring
    steps:
      - uses: actions/checkout@v4
        with:
          path: logring
      - uses: actions/checkout@v4
        with:
          repository: vhrdtech/wire_weaver
          path: wire_weaver
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: logring
    steps:
      - uses: actions/checkout@v4
        with:
          path: logring
      - uses: actions/checkout@v4
        with:
          repository: vhrdtech/wire_weaver
          path: wire_weaver
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: thumbv8m.main-none-eabihf
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo check -p logring --no-default-features --target thumbv8m.main-none-eabihf
      # the book's drive example as firmware for the RP2350's core
      - run: cargo clippy -p logring_example --target thumbv8m.main-none-eabihf -- -D warnings
      - run: cargo build -p logring_example --target thumbv8m.main-none-eabihf
      - run: cargo clippy -p logring --all-targets --no-default-features --features std,card-check,crc-table -- -D warnings

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: logring
    steps:
      - uses: actions/checkout@v4
        with:
          path: logring
      - uses: actions/checkout@v4
        with:
          repository: vhrdtech/wire_weaver
          path: wire_weaver
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      # the small build (no tail-positions): its mount, power-cut and cross-build tests
      - run: cargo test -p logring --no-default-features --features std

  test-py:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: logring
    steps:
      - uses: actions/checkout@v4
        with:
          path: logring
      - uses: actions/checkout@v4
        with:
          repository: vhrdtech/wire_weaver
          path: wire_weaver
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
      - working-directory: logring/crates/logring_wheel
        run: uv run --group dev pytest -q

  cargo-sort:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: logring
    steps:
      - uses: actions/checkout@v4
        with:
          path: logring
      - uses: actions/checkout@v4
        with:
          repository: vhrdtech/wire_weaver
          path: wire_weaver
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-sort
      - run: cargo sort --workspace --grouped --check

  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@v1

  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # spl, spirit_level's CLI, at 0.7.5, the release of the justfile's `spl`: `just book-strict` runs `spl book refs`
      # first, and the prose lints are its own
      - run: cargo install --locked --git https://github.com/romixlab/spirit_level --rev 99d6d1632be6c6474645092061bee0d5ec8fe19d spirit_level_cli
      - run: just book-check
