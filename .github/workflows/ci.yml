name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: logring
    steps:
      - uses: actions/checkout@v4
        with:
          path: logring
      - uses: actions/checkout@v4
        with:
          repository: vhrdtech/wire_weaver
          path: wire_weaver
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: logring
    steps:
      - uses: actions/checkout@v4
        with:
          path: logring
      - uses: actions/checkout@v4
        with:
          repository: vhrdtech/wire_weaver
          path: wire_weaver
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: thumbv8m.main-none-eabihf
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo check -p logring --no-default-features --target thumbv8m.main-none-eabihf

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: logring
    steps:
      - uses: actions/checkout@v4
        with:
          path: logring
      - uses: actions/checkout@v4
        with:
          repository: vhrdtech/wire_weaver
          path: wire_weaver
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  test-py:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: logring
    steps:
      - uses: actions/checkout@v4
        with:
          path: logring
      - uses: actions/checkout@v4
        with:
          repository: vhrdtech/wire_weaver
          path: wire_weaver
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
      - working-directory: logring/crates/logring_py
        run: uv run --group dev pytest -q

  cargo-sort:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: logring
    steps:
      - uses: actions/checkout@v4
        with:
          path: logring
      - uses: actions/checkout@v4
        with:
          repository: vhrdtech/wire_weaver
          path: wire_weaver
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-sort
      - run: cargo sort --workspace --grouped --check

  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@v1
