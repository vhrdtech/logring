[package]
name = "logring_wheel"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The logring Python wheel: the extension module of logring_py, built by maturin"
publish = false # distributed as a Python wheel, see pyproject.toml

[lib]
crate-type = ["cdylib"]

[dependencies]
logring_py = { path = "../logring_py", version = "0.1.0" }
# the stable ABI (one wheel for Python 3.9 and later) is the wheel's choice, not logring_py's: a wheel that links
# logring_py (wire_weaver's) picks its own
pyo3 = { workspace = true, features = ["abi3-py39"] }
ww_snapshots.workspace = true

[build-dependencies]
ww_snapshots.workspace = true
