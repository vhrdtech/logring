[package]
name = "logring"
description = "Power-cut-safe ring log store for embedded devices: many tracks of shrink_wrap data in one preallocated file, no_std, no alloc"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# card images of the cross-build tests (src/tests/cross.rs)
exclude = ["testdata"]

[features]
default = ["card-check", "crc-table", "tail-positions"]
# Host-side use (logring_export, logring_cli, tests): file-backed media, no RAM/flash limits assumed.
std = ["ww_stream/std", "wire_weaver/std", "ww_si/std", "exfat_lite?/std"]
# The ring as the file logring.wlr of an exFAT volume (LOG-3): ExfatRing, the mount check, format and card check.
exfat = ["dep:exfat_lite"]
# The card check of exfat::format_card (fake-card aliasing test, write-size sweep), 3.6-5 KB of flash; without
# it a format checks nothing and stores no measured flush size (LOG-3).
card-check = []
# CRC-32C with a 1 KB table; without it bit by bit (slower, about 1 KB less flash). crc-hw overrides both: the
# firmware's CRC unit through logring::set_crc32c! (format::crc).
crc-table = []
crc-hw = []
# The mount recovers every track's position from the tail's last flush (6-9 KB of flash, the 1 KB peek buffer);
# without it every track starts at 0 in a new stream after each boot, torn records at the tail aren't counted on
# the device and there is no TrackStore (S3, LOG-1). Cards stay compatible both ways.
tail-positions = []
# BddDevice: an SD driver implementing block-device-driver's BlockDevice<512> under exfat (multi-block writes).
block-device-driver = ["exfat", "dep:block-device-driver", "dep:aligned"]

[dependencies]
aligned = { workspace = true, optional = true }
block-device-driver = { workspace = true, optional = true }
crc.workspace = true
embassy-sync.workspace = true
exfat_lite = { workspace = true, optional = true }
thiserror.workspace = true
wire_weaver.workspace = true
ww_si.workspace = true
ww_stream.workspace = true

[dev-dependencies]
ww_client_server.workspace = true
