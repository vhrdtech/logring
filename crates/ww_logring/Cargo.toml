[package]
name = "ww_logring"
description = "Power-cut-safe ring log store for embedded devices: many tracks of shrink_wrap data in one preallocated file, no_std, no alloc"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
# Host-side use (ww_logring_export, ww_logring_cli, tests): file-backed media, no RAM/flash limits assumed.
std = ["ww_stream/std", "wire_weaver/std", "ww_si/std", "exfat_lite?/std"]
# The ring as the file logring.wlr of an exFAT volume (LOG-3): ExfatRing, the mount check, format and card check.
exfat = ["dep:exfat_lite"]

[dependencies]
crc.workspace = true
exfat_lite = { workspace = true, optional = true }
thiserror.workspace = true
wire_weaver.workspace = true
ww_si.workspace = true
ww_stream.workspace = true

[dev-dependencies]
