[package]
name = "ww_logring"
description = "Power-cut-safe ring log store for embedded devices: many tracks of shrink_wrap data in one preallocated file, no_std, no alloc"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["card-check"]
# Host-side use (ww_logring_export, ww_logring_cli, tests): file-backed media, no RAM/flash limits assumed.
std = ["ww_stream/std", "wire_weaver/std", "ww_si/std", "exfat_lite?/std"]
# The ring as the file logring.wlr of an exFAT volume (LOG-3): ExfatRing, the mount check, format and card check.
exfat = ["dep:exfat_lite"]
# The card check of exfat::format_card (fake-card aliasing test, write-size sweep), 3.6-5 KB of flash; without
# it a format checks nothing and stores no measured flush size (LOG-3).
card-check = []
# BddDevice: an SD driver implementing block-device-driver's BlockDevice<512> under exfat (multi-block writes).
block-device-driver = ["exfat", "dep:block-device-driver", "dep:aligned"]

[dependencies]
aligned = { workspace = true, optional = true }
block-device-driver = { workspace = true, optional = true }
crc.workspace = true
embassy-sync.workspace = true
exfat_lite = { workspace = true, optional = true }
thiserror.workspace = true
wire_weaver.workspace = true
ww_si.workspace = true
ww_stream.workspace = true

[dev-dependencies]
ww_client_server.workspace = true
