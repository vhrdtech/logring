[package]
name = "logring_example"
description = "The book's running example: the drive's firmware logging to a ring on a simulated SD card, no_std, no alloc"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false

# the wire version of the drive's API root (link setup decides on it)
[package.metadata.wire_weaver]
wire = "w1.0"

[features]
# story: the runs behind every number of the book, on the host (logring's std, its scan)
std = ["logring/std"]

[dependencies]
exfat_lite.workspace = true
logring = { workspace = true, features = ["card-check", "crc-table", "exfat", "tail-positions"] }
ww_api.workspace = true
ww_si.workspace = true

# loads the Drive API's bundle from source and writes it, shrink_wrap-encoded, for build.rs to include
[build-dependencies]
wire_weaver = { workspace = true, features = ["std"] }
wire_weaver_core.workspace = true

# the tests read the ring back with logring's sequential scan, and live_reading.rs reads it through a TrackStore
[dev-dependencies]
embassy-sync.workspace = true
logring = { workspace = true, features = ["std", "card-check", "crc-table", "exfat", "tail-positions"] }
ww_stream = { workspace = true, features = ["std"] }
